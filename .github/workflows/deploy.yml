name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Cho phép bấm chạy tay trong tab Actions
  workflow_dispatch:

# Quyền tối thiểu để publish lên Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Không chạy chồng nhau; deploy đang chạy thì để chạy nốt
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          # Ưu tiên Repository variables; fallback sang Secrets nếu bạn set nhầm chỗ.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Repo không phải <user>.github.io nên site nằm ở /NhaDatLuyenPhat
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Thiếu NEXT_PUBLIC_SUPABASE_URL hoặc NEXT_PUBLIC_SUPABASE_ANON_KEY."
            echo "::error::Vào Settings > Secrets and variables > Actions > Variables để thêm."
            exit 1
          fi
          npm run build

      - name: Add .nojekyll
        # Không có file này, GitHub Pages bỏ qua thư mục _next/ của Next.js
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
